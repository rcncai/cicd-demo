name: redox-upgrade-public-evidence
on:
  push:
    branches: [redox-upgrade-public-evidence-20260927]
    paths: ['.github/workflows/redox-upgrade-public-evidence.yml']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve bounded public inputs and provenance
        shell: bash
        run: |
          mkdir -p public_evidence
          python - <<'PY'
          import urllib.request, urllib.parse, re, json, hashlib, pathlib, datetime, concurrent.futures, html
          root=pathlib.Path('public_evidence'); receipt=[]
          MAX=12*1024*1024
          def get(url,name):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (public research data download)'})
                  with urllib.request.urlopen(req,timeout=35) as r:
                      data=r.read(MAX+1); typ=r.headers.get('Content-Type',''); final=r.url
                  if len(data)>MAX: raise ValueError('over size budget')
                  (root/name).write_bytes(data)
                  receipt.append(dict(url=url,final_url=final,file=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),content_type=typ,status='ok'))
                  return data.decode('utf-8',errors='replace') if not name.endswith(('.xlsx','.xls')) else ''
              except Exception as e:
                  receipt.append(dict(url=url,file=name,status='failed',error=str(e)));return ''
          fixed=[
            ('https://raw.githubusercontent.com/Li-Hongmin/ferro-arch/3ba91516e01b20873cfe6554f5e9a0617ba7d094/analysis/results/depmap_ferroptosis_modules.csv','depmap_ferroptosis_modules.csv'),
            ('https://raw.githubusercontent.com/ELares/cancer_research/main/analysis/calibration/ctrpv2_ferroptosis_curves.csv','ctrpv2_ferroptosis_curves.csv'),
            ('https://raw.githubusercontent.com/ablucher/ReplicationStressSignatures/master/data/DepMapCCLE_data/sample_info_cleaned_021521.csv','sample_info_cleaned.csv'),
            ('https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8299533/fullTextXML','soula_2020.xml'),
            ('https://www.nature.com/articles/s41589-020-0613-y','soula_2020.html'),
            ('https://www.nature.com/articles/s41556-025-01856-x','riboflavin_2026.html'),
            ('https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10439209/fullTextXML','luminal_2023.xml')]
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as ex:
              list(ex.map(lambda z:get(*z),fixed))
          for filename in ['soula_2020.html','riboflavin_2026.html']:
              p=root/filename
              if not p.exists():continue
              text=p.read_text(errors='replace')
              urls=sorted(set(html.unescape(x) for x in re.findall(r'(?:href|src)=[\"\']([^\"\']+\.(?:xlsx|xls)(?:\?[^\"\']*)?)[\"\']',text)))
              urls=[urllib.parse.urljoin('https://www.nature.com',u) for u in urls]
              for j,u in enumerate(urls[:18]):
                  ext='.xlsx' if '.xlsx' in u else '.xls'
                  get(u,filename.replace('.html','')+'_supp_'+str(j)+ext)
          p=root/'soula_2020.xml'
          if p.exists():
              text=p.read_text(errors='replace')
              hrefs=sorted(set(re.findall(r'(?:xlink:href|href)=[\"\']([^\"\']+\.(?:xlsx|xls))[\"\']',text)))
              for j,h in enumerate(hrefs[:10]):
                  u=h if h.startswith('http') else 'https://pmc.ncbi.nlm.nih.gov/articles/instance/8299533/bin/'+h
                  get(u,'soula_xml_supp_'+str(j)+('.xlsx' if '.xlsx' in h else '.xls'))
          (root/'receipt.json').write_text(json.dumps({'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'inputs':receipt},indent=2))
          print(json.dumps([{'file':r['file'],'status':r['status'],'bytes':r.get('bytes')} for r in receipt],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: redox-upgrade-public-evidence
          path: public_evidence/
          retention-days: 7
          if-no-files-found: error

name: redox-source-excluded-strict54-rds

on:
  push:
    branches:
      - redox-idrr-subset-20260927

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official idrrR
        uses: actions/checkout@v4
        with:
          repository: kris-nader/idrrR
          ref: 4f41bf071a3dced4ccd7b41259da322fbb05a069
          path: idrrR
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: idrrR
          cache-version: 1
      - name: Download official Zenodo RDS
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o /tmp/iDRR_raw_data.rds \
            "https://zenodo.org/records/18775863/files/iDRR_raw_data.rds?download=1"
          echo 'eecf2c858f789fcce7105e0823afc3ef  /tmp/iDRR_raw_data.rds' | md5sum -c -
          mkdir -p redox_source_excluded_strict54
          md5sum /tmp/iDRR_raw_data.rds > redox_source_excluded_strict54/input_md5.txt
          sha256sum /tmp/iDRR_raw_data.rds > redox_source_excluded_strict54/input_sha256.txt
      - name: Recompute strict54 source-excluded SEE with official fit
        shell: bash
        run: |
          set -euo pipefail
          cp idrrR/R/metrics.R /tmp/metrics_noplot.R
          python - <<'PY'
          p='/tmp/metrics_noplot.R'
          s=open(p,encoding='utf-8').read()
          needle='  IC50_dataframe[, numeric_cols] <- round(IC50_dataframe[, numeric_cols], 2)\n'
          assert needle in s
          s=s.replace(needle, needle+'  return(IC50_dataframe)\n',1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          cat > /tmp/recompute54.R <<'RS'
          suppressPackageStartupMessages({
            library(data.table); library(drc); library(minpack.lm); library(dplyr); library(ggplot2)
          })
          source("idrrR/R/dss_library.R")
          source("/tmp/metrics_noplot.R")
          norm <- function(x) gsub("[^[:alnum:]]","",toupper(as.character(x)))
          keys <- fread("redox_audit/STRICT_54_CELL_KEYS.csv")
          if (nrow(keys)!=54L || uniqueN(keys$cell_key)!=54L) stop("strict54 key file invalid")
          raw <- readRDS("/tmp/iDRR_raw_data.rds")
          if (!is.data.table(raw)) setDT(raw)
          raw[, drug_key := norm(treatmentid)]
          raw[, cell_key := norm(sampleid)]
          er <- raw[drug_key=="ERASTIN" &
                    cell_key %in% keys$cell_key &
                    tolower(as.character(dataset))!="ctrpv2"]
          ds_all <- sort(unique(as.character(er$dataset)))
          if (!setequal(ds_all,c("gCSI","PRISM"))) stop(paste("unexpected datasets",paste(ds_all,collapse=";")))
          present <- sort(unique(er$cell_key))
          if (!identical(present,sort(keys$cell_key))) stop(paste("missing strict cells",paste(setdiff(keys$cell_key,present),collapse=";")))

          out <- list(); failures <- list()
          for (i in seq_len(nrow(keys))) {
            ck <- keys$cell_key[i]
            x <- er[cell_key==ck]
            ds <- sort(unique(as.character(x$dataset)))
            if (!setequal(ds,c("gCSI","PRISM"))) {
              failures[[length(failures)+1]] <- list(cell_key=ck,reason="dataset_set",datasets=paste(ds,collapse=";")); next
            }
            dd <- unique(as.character(x$DD))
            if (length(dd)!=1L) {
              failures[[length(failures)+1]] <- list(cell_key=ck,reason="DD_not_unique",n_DD=length(dd)); next
            }
            med <- x[,.(med_viability=median(viability,na.rm=TRUE)),by=.(DD,dataset,dose)]
            setorder(med,dataset,dose)
            dc <- med[,.N,by=dataset]
            if (any(dc$N<2L)) {
              failures[[length(failures)+1]] <- list(cell_key=ck,reason="dataset_lt2_doses"); next
            }
            ans <- tryCatch(
              calculate_all(dose=med$dose,
                            inhibition_percent=100-med$med_viability,
                            dataset=med$dataset,
                            drug_name=med$DD[1]),
              error=function(e)e
            )
            if (inherits(ans,"error")) {
              failures[[length(failures)+1]] <- list(cell_key=ck,reason="fit_error",message=conditionMessage(ans)); next
            }
            out[[length(out)+1]] <- data.frame(
              cell_key=ck,
              cell_line=keys$cell_line[i],
              source_excluded_SEE=as.numeric(ans$SE_of_estimate[1]),
              source_excluded_IC50=as.numeric(ans$IC50[1]),
              source_excluded_DRS=as.numeric(ans$DRS[1]),
              n_raw_rows=nrow(x),
              n_median_dose_points=nrow(med),
              gCSI_dose_points=dc[dataset=="gCSI",N],
              PRISM_dose_points=dc[dataset=="PRISM",N],
              stringsAsFactors=FALSE
            )
          }
          ok <- rbindlist(out,fill=TRUE)
          fwrite(ok,"redox_source_excluded_strict54/erastin_source_excluded_see_strict54.csv")
          fwrite(er[,.N,by=.(cell_key,dataset)][order(cell_key,dataset)],
                 "redox_source_excluded_strict54/raw_rows_per_pair_dataset.csv")
          audit <- data.frame(
            key=c("idrrR_commit","raw_total_rows","strict54_requested",
                  "raw_erastin_rows_after_source_exclusion","source_dropped",
                  "remaining_datasets","successful_fits","failed_fits","plotting_patch"),
            value=c("4f41bf071a3dced4ccd7b41259da322fbb05a069",nrow(raw),nrow(keys),
                    nrow(er),"CTRPv2",paste(ds_all,collapse=";"),nrow(ok),length(failures),
                    "return after official rounded IC50_dataframe; no numerical edits")
          )
          fwrite(audit,"redox_source_excluded_strict54/recompute_audit.csv")
          if (length(failures)>0) writeLines(capture.output(str(failures)),
                                             "redox_source_excluded_strict54/failures.txt")
          if (nrow(ok)<40L) stop(paste("too few successful fits",nrow(ok)))
          print(audit)
          RS
          Rscript /tmp/recompute54.R
      - name: Upload strict54 source-excluded results
        uses: actions/upload-artifact@v4
        with:
          name: redox-source-excluded-strict54-rds
          path: redox_source_excluded_strict54/
          if-no-files-found: error
          retention-days: 1

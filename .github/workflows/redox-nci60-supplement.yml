name: redox-nci60-supplement

on:
  push:
    branches:
      - redox-nci60-20260927

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Shimada 2016 supplementary XLSX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p redox_nci60_supp
          python - <<'PY'
          import urllib.request, urllib.error, os, json, re, zipfile, xml.etree.ElementTree as ET
          urls=[
            "https://pmc.ncbi.nlm.nih.gov/articles/PMC4792701/bin/NIHMS753246-supplement-2.xlsx",
            "https://pmc.ncbi.nlm.nih.gov/articles/instance/4792701/bin/NIHMS753246-supplement-2.xlsx",
            "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4792701/bin/NIHMS753246-supplement-2.xlsx",
          ]
          out="/tmp/supp2.xlsx"
          log=[]
          for u in urls:
              try:
                  req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      b=r.read()
                  ok=b[:2]==b'PK'
                  log.append({"url":u,"bytes":len(b),"xlsx_magic":ok})
                  if ok and len(b)>10000:
                      open(out,"wb").write(b); break
              except Exception as e:
                  log.append({"url":u,"error":repr(e)})
          else:
              raise SystemExit("No XLSX URL succeeded: "+json.dumps(log))
          open("redox_nci60_supp/download_audit.json","w").write(json.dumps(log,indent=2))
          import hashlib
          b=open(out,"rb").read()
          open("redox_nci60_supp/input_sha256.txt","w").write(hashlib.sha256(b).hexdigest()+"  NIHMS753246-supplement-2.xlsx\n")
          PY
          python - <<'PY'
          import openpyxl, json, re, csv, os
          p="/tmp/supp2.xlsx"
          wb=openpyxl.load_workbook(p,data_only=True,read_only=True)
          audit={"sheets":{},"hits":[]}
          terms=["RSL3","ML162","ML210","ERASTIN","GI50","NCI"]
          for ws in wb.worksheets:
              audit["sheets"][ws.title]={"max_row":ws.max_row,"max_column":ws.max_column}
              for row in ws.iter_rows():
                  vals=[c.value for c in row]
                  s=" | ".join("" if v is None else str(v) for v in vals)
                  if any(t.lower() in s.lower() for t in terms):
                      audit["hits"].append({"sheet":ws.title,"row":row[0].row,"text":s[:3000]})
          with open("redox_nci60_supp/workbook_audit.json","w",encoding="utf-8") as f:
              json.dump(audit,f,indent=2,ensure_ascii=False)
          print(json.dumps(audit,indent=2,ensure_ascii=False)[:30000])
          # dump modest neighborhoods around hit rows for deterministic inspection
          for ws in wb.worksheets:
              hrs=sorted({h["row"] for h in audit["hits"] if h["sheet"]==ws.title})
              if not hrs: continue
              rows=set()
              for r in hrs:
                  rows.update(range(max(1,r-5),min(ws.max_row,r+5)+1))
              out=f"redox_nci60_supp/{re.sub(r'[^A-Za-z0-9._-]+','_',ws.title)}_hit_neighborhood.tsv"
              with open(out,"w",encoding="utf-8",newline="") as f:
                  w=csv.writer(f,delimiter="\t")
                  for r in sorted(rows):
                      w.writerow([r]+[ws.cell(r,c).value for c in range(1,ws.max_column+1)])
          PY
      - name: Upload supplement audit
        uses: actions/upload-artifact@v4
        with:
          name: redox-nci60-supplement-audit
          path: redox_nci60_supp/
          if-no-files-found: error
          retention-days: 1

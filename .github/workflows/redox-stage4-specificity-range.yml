name: redox-stage4-specificity-range
on:
  push:
    branches: [redox-upgrade-public-evidence-20260927]
    paths: ['.github/workflows/redox-stage4-specificity-range.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract published numeric worksheets without embedded images
        shell: bash
        run: |
          mkdir -p specificity_tables
          python - <<'PY'
          import urllib.request, io, zipfile, re, csv, json, pathlib, hashlib, xml.etree.ElementTree as E
          root=pathlib.Path('specificity_tables')
          url='https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41556-025-01856-x/MediaObjects/41556_2025_1856_MOESM19_ESM.xlsx'
          receipt={'source_url':url,'status':'started','requests':[]}
          class Remote(io.RawIOBase):
              def __init__(self):
                  self.pos=0;self.total=0
                  q=urllib.request.Request(url,headers={'Range':'bytes=0-0'})
                  with urllib.request.urlopen(q,timeout=30) as f:
                      if f.status!=206:raise ValueError('server does not support bounded HTTP Range')
                      self.n=int(f.headers['Content-Range'].split('/')[-1]);f.read(1)
              def seekable(self):return True
              def readable(self):return True
              def tell(self):return self.pos
              def seek(self,o,w=0):
                  self.pos=o if w==0 else self.pos+o if w==1 else self.n+o;return self.pos
              def read(self,n=-1):
                  n=self.n-self.pos if n<0 else min(n,self.n-self.pos)
                  if n==0:return b''
                  if n>12*1024*1024 or self.total+n>32*1024*1024:raise ValueError('range budget exceeded')
                  a=self.pos;b=a+n-1
                  q=urllib.request.Request(url,headers={'Range':f'bytes={a}-{b}'})
                  with urllib.request.urlopen(q,timeout=30) as f:
                      if f.status!=206:raise ValueError('Range ignored')
                      data=f.read(n+1)
                  if len(data)!=n:raise ValueError('range length mismatch')
                  self.pos+=n;self.total+=n;receipt['requests'].append([a,b]);return data
          try:
              f=Remote();z=zipfile.ZipFile(f)
              ns='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}';rel='{http://schemas.openxmlformats.org/officeDocument/2006/relationships}'
              wb=E.fromstring(z.read('xl/workbook.xml'));rs=E.fromstring(z.read('xl/_rels/workbook.xml.rels'));rm={x.attrib['Id']:x.attrib['Target'] for x in rs}
              ss=[]
              if 'xl/sharedStrings.xml' in z.namelist():
                  for x in E.fromstring(z.read('xl/sharedStrings.xml')):ss.append(''.join(t.text or '' for t in x.iter(ns+'t')))
              receipt['sheets']=[];receipt['outputs']=[]
              for s in wb.find(ns+'sheets'):
                  name=s.attrib['name'];receipt['sheets'].append(name)
                  if not re.search(r'2\s*[pq]$',name,re.I):continue
                  t=rm[s.attrib[rel+'id']];t='xl/'+t.lstrip('/') if not t.startswith('xl/') else t
                  doc=E.fromstring(z.read(t));out=[]
                  for row in doc.find(ns+'sheetData'):
                      d={}
                      for c in row:
                          letters=re.match('[A-Z]+',c.attrib['r'])[0];j=0
                          for ch in letters:j=j*26+ord(ch)-64
                          v=c.find(ns+'v');tp=c.attrib.get('t')
                          if tp=='s':value=ss[int(v.text)]
                          elif tp=='inlineStr':value=''.join(x.text or '' for x in c.iter(ns+'t'))
                          else:value=v.text if v is not None else ''
                          d[j-1]=value
                      out.append([d.get(k,'') for k in range(max(d,default=-1)+1)])
                  fn=re.sub('[^A-Za-z0-9]+','_',name)+'.csv'
                  with open(root/fn,'w',newline='') as h:csv.writer(h).writerows(out)
                  receipt['outputs'].append({'sheet':name,'file':fn,'sha256':hashlib.sha256((root/fn).read_bytes()).hexdigest(),'rows':len(out)})
              receipt.update(status='ok',original_xlsx_bytes=f.n,transferred_bytes=f.total)
          except Exception as e:receipt.update(status='failed',error=str(e))
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: redox-stage4-specificity-range
          path: specificity_tables/
          retention-days: 7
          if-no-files-found: error
